name: CI

on:
  push:
  pull_request:

# Cancel older runs of the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Placeholder public values: the image only has to build, start as a
      # non-root user and pass its healthcheck (no database needed for that).
      - name: Build the image
        run: >
          docker build -t stocktill:ci
          --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:8080
          --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          .

      - name: Run it and wait for the healthcheck
        run: |
          docker run -d --name stocktill -p 8080:8080 -e PORT=8080 stocktill:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' stocktill)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' stocktill | grep -qx healthy
          curl -fsS http://localhost:8080/api/health
          test "$(docker exec stocktill whoami)" = node
          docker image inspect stocktill:ci --format 'Image size: {{.Size}} bytes'

      - name: Container logs on failure
        if: failure()
        run: docker logs stocktill

  database:
    name: Database, integration and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (includes the Supabase CLI)
        run: npm ci

      # Postgres + Auth + REST API + Mailpit: what the app and tests need.
      # Migrations + seed are applied on start. The CI stack is ephemeral and
      # uses Supabase's public local defaults (no secrets).
      - name: Start local Supabase
        run: >
          npx supabase start
          -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Drizzle migrations are consistent
        run: npm run db:check

      - name: No schema change without a migration
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "db/schema changed but no migration was committed. Run: npm run db:generate"
            git status --porcelain supabase/migrations
            exit 1
          fi

      - name: pgTAP tests (RLS, isolation, roles, stock, audit)
        run: npm run test:db

      - name: Lint SQL functions
        run: npm run db:lint

      - name: Integration tests (demo users through the app services)
        run: npm run test:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (signup, onboarding, invitations, roles)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
