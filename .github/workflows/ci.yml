name: CI

on:
  push:
  pull_request:

# Cancel older runs of the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Database, integration and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (includes the Supabase CLI)
        run: npm ci

      # Postgres + Auth + REST API + Mailpit: what the app and tests need.
      # Migrations + seed are applied on start. The CI stack is ephemeral and
      # uses Supabase's public local defaults (no secrets).
      - name: Start local Supabase
        run: >
          npx supabase start
          -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Drizzle migrations are consistent
        run: npm run db:check

      - name: No schema change without a migration
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "db/schema changed but no migration was committed. Run: npm run db:generate"
            git status --porcelain supabase/migrations
            exit 1
          fi

      - name: pgTAP tests (RLS, isolation, roles, stock, audit)
        run: npm run test:db

      - name: Lint SQL functions
        run: npm run db:lint

      - name: Integration tests (demo users through the app services)
        run: npm run test:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (signup, onboarding, invitations, roles)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
